{% extends "base.html" %}
{% block title %}手动录入选题{% endblock %}
{% block nav_manual %}bg-brand-50 text-brand-700 font-medium{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <h1 class="text-xl font-bold text-gray-800 mb-4">手动录入选题</h1>
    <p class="text-sm text-gray-500 mb-6">从X、B站、抖音或其他来源发现的好选题，手动录入后会自动触发评分。</p>

    <form onsubmit="submitTopic(event)" class="bg-white rounded-lg border border-gray-200 p-5 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">标题 <span class="text-red-500">*</span></label>
            <input type="text" name="title" required class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="选题标题">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">摘要</label>
            <textarea name="summary" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="一句话概述选题内容"></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">原始内容</label>
            <textarea name="raw_content" rows="8" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="粘贴原文、推文、视频描述等"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">来源类型</label>
                <select name="source_type" class="w-full px-3 py-2 border border-gray-300 rounded text-sm">
                    <option value="manual">手动</option>
                    <option value="x">X (Twitter)</option>
                    <option value="bilibili">B站</option>
                    <option value="douyin">抖音</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">来源链接</label>
                <input type="text" name="source_ref" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="URL（可选）">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">标签（逗号分隔）</label>
            <input type="text" name="tags" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="大模型, AI工具, ...">
        </div>

        <div class="flex gap-2">
            <button type="submit" class="px-4 py-2 bg-brand-500 text-white text-sm rounded hover:bg-brand-600">录入并评分</button>
            <a href="/" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded hover:bg-gray-200">取消</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
async function submitTopic(e) {
    e.preventDefault();
    const form = e.target;
    const tagsStr = form.tags.value.trim();
    const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];

    const body = {
        title: form.title.value,
        summary: form.summary.value,
        raw_content: form.raw_content.value,
        source_type: form.source_type.value,
        source_ref: form.source_ref.value,
        tags: tags,
    };

    const result = await apiPost('/api/topics', body);
    if (result.id) {
        alert('选题已创建，正在后台评分...');
        window.location.href = `/topics/${result.id}`;
    } else {
        alert('创建失败：' + (result.detail || JSON.stringify(result)));
    }
}
</script>
{% endblock %}
